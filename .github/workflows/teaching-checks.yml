name: Check local teaching workflow

on:
  push:
    branches: [main, feature/local-teaching]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teaching:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked application dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Check framework and migrations
        run: |
          python server/manage.py check
          python server/manage.py makemigrations --check --dry-run
      - name: Check access, execution and failure boundaries
        run: python server/manage.py test teaching.tests --verbosity 1
      - name: Check browser scripts
        run: |
          node --check dist/app.js
          node --check server/static/app.js
      - name: Audit the pinned dependency list
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          python -m pip_audit --disable-pip --no-deps -r requirements.lock --progress-spinner off
