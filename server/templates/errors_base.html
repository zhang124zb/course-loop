{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}暂时无法打开{% endblock %} · CourseLoop</title>
  <link rel="stylesheet" href="{% static 'app.css' %}">
</head>
<body>
  <main class="standalone-error" id="main">
    <a class="brand" href="/dashboard/"><span class="brand-mark" aria-hidden="true">&lt;/&gt;</span><span><strong>CourseLoop</strong><small>本机教学空间</small></span></a>
    <section class="panel error-panel">
      <span class="badge warning">{% block status_code %}提示{% endblock %}</span>
      <h1>{% block heading %}暂时无法打开此页面{% endblock %}</h1>
      <p>{% block message %}请返回工作台后重试。{% endblock %}</p>
      <div class="actions"><a class="button primary" href="/dashboard/">返回工作台</a><a class="button" href="/login/">前往登录</a></div>
    </section>
    <p class="standalone-error-foot">模拟学生数据 · 本机教学演示</p>
  </main>
</body>
</html>
